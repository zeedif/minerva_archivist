name: minerva_core
description: >-
  Audits, filters (1G1R) and selectively downloads ROM sets from the MiNERVA
  Archive. Pure Dart; shared by the CLI and the desktop app.
version: 3.0.0-dev
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  http: ^1.6.0
  libtorrent_dart: ^1.2.0
  path: ^1.9.1
  xml: ^7.0.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
