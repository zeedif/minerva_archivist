name: Release

# Builds the command line and the desktop app for every platform and attaches
# them to the GitHub release of the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the builds to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - name: Core tests
        working-directory: packages/minerva_core
        run: dart test
      - name: Desktop tests
        working-directory: apps/desktop
        run: flutter test

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "MiNERVA Archivist ${TAG#v}" --generate-notes --verify-tag

  build:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - name: Build the command line
        working-directory: apps/cli
        run: dart build cli
      - name: Build the desktop app
        working-directory: apps/desktop
        run: flutter build ${{ matrix.platform }} --release
      - name: Package
        shell: bash
        run: |
          version="${TAG#v}"
          suffix="$version-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist stage
          cli="stage/minerva-cli-$suffix"
          desktop="stage/minerva-desktop-$suffix"
          mkdir -p "$cli" "$desktop"
          cp -R apps/cli/build/cli/*/bundle/. "$cli/"
          case "${{ matrix.platform }}" in
            windows) cp -R apps/desktop/build/windows/x64/runner/Release/. "$desktop/" ;;
            linux) cp -R apps/desktop/build/linux/x64/release/bundle/. "$desktop/" ;;
            macos) cp -R "apps/desktop/build/macos/Build/Products/Release/MiNERVA Archivist.app" "$desktop/" ;;
          esac
          for folder in "$cli" "$desktop"; do
            cp LICENSE README.md README.ES.md "$folder/"
          done
          cd stage
          for folder in */; do
            name="${folder%/}"
            case "${{ matrix.platform }}" in
              windows) 7z a -tzip "../dist/$name.zip" "$name" >/dev/null ;;
              macos) ditto -c -k --keepParent "$name" "../dist/$name.zip" ;;
              linux) tar -czf "../dist/$name.tar.gz" "$name" ;;
            esac
          done
          ls -l ../dist
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
